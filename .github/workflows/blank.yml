# name: Gerar APK
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto da Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "*.zip"
          unzip -q *.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Montar o app
        working-directory: spiderbench-main
        run: |
          npm install
          npm run build
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android
      - name: Compilar o APK
        working-directory: spiderbench-main/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SpiderVR-apk
          path: spiderbench-main/android/app/build/outputs/apk/debug/app-debug.apk
